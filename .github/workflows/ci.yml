name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Build, unit test, lint, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Versions come from docs/decisions.md §1 (compileSdk 37, Build Tools 36.0.0).
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Gradle fast checks
        run: >
          ./gradlew
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:lintDebug
          spotlessCheck
          --no-daemon
          --stacktrace

[versions]
# Toolchain — see docs/decisions.md §1. AGP 9.x uses built-in Kotlin, so there is
# no `kotlin-android` plugin here.
agp = "9.4.0"
# Kotlin is pinned above AGP 9.4's bundled KGP 2.2.10 via the root buildscript
# classpath in build.gradle.kts. The Compose compiler plugin must match this.
kotlin = "2.4.20"
# KSP uses decoupled versioning from Kotlin 2.3 onward; KSP 2.3.x supports
# Kotlin 2.4.x. Applied by the app module for Room code generation (M05).
ksp = "2.3.11"

# Persistence — Room chosen in docs/decisions.md §1 ("Persistence").
# Room 2.8.5 (2026-09-09) is the pinned stable release; room-ktx was merged into
# room-runtime in 2.7.0, so no separate KTX artifact is declared.
room = "2.8.5"

# Settings persistence — DataStore (Preferences) chosen in docs/decisions.md §1
# ("Persistence": typed key/value settings). 1.2.1 is the pinned stable release
# on Google Maven (checked 2026-09-29); no alpha/beta is used. Settings never
# hold secrets; credentials stay in the M13 Keystore-backed CredentialStore.
datastore = "1.2.1"

# AndroidX / Compose — see docs/decisions.md §1.
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycleViewmodelCompose = "2.11.0"

# Developer tooling (formatting / lint).
spotless = "8.10.3"
ktlint = "1.8.0"

# On-device STT (M08). ML Kit GenAI Speech Recognition is the initial and only STT
# engine (docs/decisions.md §2.1). The artifact is alpha and verified against
# Google Maven on 2026-09-28:
# https://dl.google.com/dl/android/maven2/com/google/mlkit/genai-speech-recognition/1.0.0-alpha1/genai-speech-recognition-1.0.0-alpha1.pom
mlkitGenaiSpeech = "1.0.0-alpha1"

# Coroutines/Flow for the bounded event-stream contracts. Already resolved
# transitively by lifecycle/Compose; pinned explicitly so the domain layer does
# not depend on a transitive version. See docs/decisions.md and M02.
coroutines = "1.9.0"

# Remote LLM transport (M14). OkHttp 5.1.0 is the pinned streaming-capable HTTP
# client; it is Apache-2.0 and already on Maven Central (verified resolvable
# 2026-09-29). Its JVM artifact depends on okio 3.15.0. The public app contract
# never sees an OkHttp type (see docs/llm-transport.md, LlmContractPurityTest).
okhttp = "5.1.0"
# JSON for the shared remote transport and provider adapters (M14).
# kotlinx-serialization-json 1.10.0 is Apache-2.0 and used through a small
# library-free `JsonNode` facade in the transport, so no serialization type
# reaches the contract or the adapters (verified resolvable 2026-09-29). It
# requires kotlin-stdlib 2.3.0, below the pinned 2.4.20 toolchain.
kotlinxSerialization = "1.10.0"

# Testing.
junit = "4.13.2"
# Robolectric runs the Room repository/schema tests on the JVM so they need no
# device (see docs/persistence.md). 4.16.x supports API 23–36; tests pin API 35
# so they also run on the JDK 17 CI image (API 36 android-all jars need JDK 21).
robolectric = "4.16.1"
# Instrumented (on-device) tests. These only run on a device via
# `:app:connectedDebugAndroidTest`; on CI/host they are compiled only
# (`:app:assembleDebugAndroidTest`). Verified on Google Maven 2026-09-29.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# `collectAsStateWithLifecycle` binds the Compose tree to the ViewModel through the
# owner lifecycle (M06). Released in lockstep with lifecycle-viewmodel-compose.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
# Compose UI tests run on the JVM under Robolectric; versions come from the Compose BOM.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# DataStore (Preferences) for typed, non-secret user settings (M22).
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# ML Kit GenAI Speech Recognition: the single on-device STT engine (M08).
mlkit-genai-speech-recognition = { module = "com.google.mlkit:genai-speech-recognition", version.ref = "mlkitGenaiSpeech" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Shared remote transport (M14): streaming HTTP + JSON. Used only by the
# `remote` package and provider adapters, never by the contracts/domain seam.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Instrumented (on-device) test foundation: runner/rules/JUnit extension. Compose
# instrumented tests reuse the BOM-managed ui-test-junit4/ui-test-manifest entries.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
